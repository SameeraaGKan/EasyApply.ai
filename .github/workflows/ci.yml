name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    name: web (lint, typecheck, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/placeholder
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder

  web-audit:
    name: web (dependency audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high

  agent-service:
    name: agent-service (install, import check)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agent-service/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -c "from app.main import app"
        env:
          AGENT_SERVICE_BEARER_TOKEN: ci-placeholder
          SUPABASE_PROJECT_URL: https://placeholder.supabase.co
          ANTHROPIC_API_KEY: sk-ci-placeholder
          VOYAGE_API_KEY: voyage-ci-placeholder
          DATABASE_URL: postgresql://user:pass@localhost:5432/placeholder
      - run: pip install pip-audit
      - run: pip-audit -r requirements.txt

  secret-scan:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
